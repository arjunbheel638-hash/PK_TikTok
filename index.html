<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK TikTok - Pakistan's Own</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;height:100vh;width:100vw}
.feed{height:100vh;width:100vw;overflow-y:scroll;scroll-snap-type:y mandatory}
.feed::-webkit-scrollbar{display:none}
.video-card{height:100vh;width:100vw;position:relative;scroll-snap-align:start;background:#000;display:flex;align-items:center;justify-content:center}
video{height:100%;width:100%;object-fit:cover}
.overlay{position:absolute;bottom:0;left:0;right:0;padding:15px 15px 90px;background:linear-gradient(transparent,rgba(0,0,0,0.8))}
.right-bar{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:20px;align-items:center;z-index:5}
.action-btn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
.action-btn.liked{background:#fe2c55}
.like-count{font-size:12px;margin-top:4px;text-align:center}
.top-bar{position:absolute;top:0;left:0;right:0;padding:15px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(rgba(0,0,0,0.6),transparent)}
.logo{font-weight:900;font-size:22px}.logo span{color:#25f4ee}.logo span:last-child{color:#fe2c55}
.upload-btn{background:#fe2c55;border:none;color:#fff;padding:8px 16px;border-radius:4px;font-weight:700}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:60px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:10}
.nav-item{font-size:11px;text-align:center;opacity:0.6}.nav-item.active{opacity:1}
.upload-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.upload-modal.show{display:flex}
.modal-box{background:#1a1a1a;width:100%;max-width:380px;border-radius:16px;padding:20px}
.modal-box input{width:100%;padding:12px;background:#2a2a2a;border:1px solid #333;border-radius:8px;color:#fff;margin-bottom:12px;font-size:14px}
.modal-box button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:700;margin-top:8px}
.btn-post{background:#fe2c55;color:#fff}.btn-cancel{background:#2a2a2a;color:#fff}
</style>
</head>
<body>
<div class="top-bar"><div class="logo"><span>PK</span> <span>TikTok</span></div><button class="upload-btn" onclick="openUpload()">+ Upload</button></div>
<div class="feed" id="feed"><div style="text-align:center;padding-top:50vh">Loading PK Videos...</div></div>
<div class="bottom-nav"><div class="nav-item active">🏠<br>Home</div><div class="nav-item">🔍<br>Discover</div><div class="nav-item" onclick="openUpload()">➕<br>Upload</div><div class="nav-item">💬<br>Inbox</div><div class="nav-item">👤<br>Me</div></div>
<div class="upload-modal" id="uploadModal"><div class="modal-box"><h3>Upload PK Video</h3><input id="vTitle" placeholder="Video Title"><input id="vUser" placeholder="Your Name @username"><input id="vUrl" placeholder="Video URL mp4: https://www.w3schools.com/html/mov_bbb.mp4"><button class="btn-post" onclick="postVideo()">Post to PK TikTok 🇵🇰</button><button class="btn-cancel" onclick="closeUpload()">Cancel</button></div></div>
<script>
const SUPABASE_URL='https://yfutzbzfpzhwhxcqhudk.supabase.co';
const SUPABASE_KEY='sb_publishable_Gf0kknydWxFco5IAVSUUaw_7vug6T3I';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let videos=[];
async function loadVideos(){
 const {data,error}=await supabaseClient.from('videos').select('*').order('created_at',{ascending:false});
 if(error||!data||data.length==0){videos=[{title:"Welcome to PK TikTok 🇵🇰 - Upload Dabao!",username:"@pktiktok_official",video_url:"https://www.w3schools.com/html/mov_bbb.mp4",likes:1250}];}else{videos=data;}
 renderFeed();
}
function renderFeed(){
 const feed=document.getElementById('feed');feed.innerHTML='';
 videos.forEach((v,i)=>{
  const card=document.createElement('div');card.className='video-card';
  card.innerHTML=`<video src="${v.video_url}" loop playsinline onclick="this.paused?this.play():this.pause()"></video><div class="overlay"><div style="opacity:0.8;font-size:14px">${v.username}</div><div style="font-weight:600">${v.title}</div></div><div class="right-bar"><div><button class="action-btn ${v._liked?'liked':''}" onclick="likeVideo(${i},this)">❤️</button><div class="like-count">${v.likes||0}</div></div><button class="action-btn">💬</button><button class="action-btn">↗️</button></div>`;
  feed.appendChild(card);
 });
 const observer=new IntersectionObserver((entries)=>{entries.forEach(e=>{const vid=e.target.querySelector('video');if(e.isIntersecting)vid.play().catch(()=>{});else vid.pause();});},{threshold:0.6});
 document.querySelectorAll('.video-card').forEach(c=>observer.observe(c));
}
async function likeVideo(idx,btn){
 const v=videos[idx];if(v._liked)return;v._liked=true;v.likes=(v.likes||0)+1;btn.classList.add('liked');btn.nextElementSibling.textContent=v.likes;
 if(v.id){await supabaseClient.from('videos').update({likes:v.likes}).eq('id',v.id);}
}
function openUpload(){document.getElementById('uploadModal').classList.add('show')}
function closeUpload(){document.getElementById('uploadModal').classList.remove('show')}
async function postVideo(){
 const title=document.getElementById('vTitle').value.trim();
 const username=document.getElementById('vUser').value.trim()||'@pakistani_user';
 const url=document.getElementById('vUrl').value.trim();
 if(!title||!url){alert('Title aur Video URL zaroori hai');return}
 const {data,error}=await supabaseClient.from('videos').insert([{title,username,video_url:url,likes:0}]).select();
 if(error){alert('Error: '+error.message);return}
 closeUpload();document.getElementById('vTitle').value='';document.getElementById('vUrl').value='';
 await loadVideos();alert('Mabrook! PK TikTok pe post ho gaya 🇵🇰');
}
loadVideos();
</script>
</body>
</html>
